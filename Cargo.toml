[workspace]
members = ["crates/core", "crates/api", "crates/cli", "crates/gui"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
walkdir = "2"
sha2 = "0.11"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
toml = "1"
ureq = "3"
winreg = "0.56"
serial_test = "3"
eframe = { version = "0.35", default-features = false, features = ["accesskit", "default_fonts", "wgpu", "x11"] }
egui = "0.35"
egui_extras = { version = "0.35", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rfd = "0.15"
base64 = "0.22"
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Keep the released wayland-scanner 0.31.10 code generation API, while
# backporting its quick-xml 0.41 security update. Newer unreleased scanner
# revisions break the released Wayland runtime crates used by eframe.
[patch.crates-io]
wayland-scanner = { path = "vendor/wayland-scanner" }

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
# Enable pedantic as warnings, then allow specific lints that are too noisy
# for this codebase or are stylistic preferences.
pedantic = { level = "warn", priority = -1 }

# Allow: these produce false positives or are too noisy for test-heavy code.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
must_use_unit = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
manual_let_else = "allow"
single_match_else = "allow"
unnested_or_patterns = "allow"
match_same_arms = "allow"
wildcard_enum_match_arm = "allow"
redundant_closure_for_method_calls = "allow"
unreadable_literal = "allow"
used_underscore_binding = "allow"
struct_excessive_bools = "allow"
unnecessary_wraps = "allow"
items_after_statements = "allow"
unused_self = "allow"
format_push_string = "allow"
wildcard_imports = "allow"
redundant_clone = "allow"
fn_to_numeric_cast = "allow"
assigning_clones = "allow"
ptr_arg = "allow"
float_cmp = "allow"
match_wildcard_for_single_variants = "allow"
# No caller uses a custom BuildHasher; generalising HashSet params is YAGNI.
implicit_hasher = "allow"
# Clippy 1.96 promotes these readability preferences. The existing forms make
# cache-control and duration constants easier to scan in this codebase.
collapsible_if = "allow"
duration_suboptimal_units = "allow"
explicit_iter_loop = "allow"
map_unwrap_or = "allow"
implicit_clone = "allow"
unnecessary_trailing_comma = "allow"
default_trait_access = "allow"
