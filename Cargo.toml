[workspace]
members = ["crates/core", "crates/api", "crates/cli", "crates/gui"]
resolver = "2"

[workspace.package]
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
dirs = "6"
walkdir = "2"
sha2 = "0.10"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
ureq = "2"
winreg = "0.55"
serial_test = "3"
eframe = "0.31"
egui = "0.31"
egui_extras = { version = "0.31", features = ["http", "image"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
base64 = "0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[workspace.lints.rust]
unused_must_use = "deny"

[workspace.lints.clippy]
# Enable pedantic as warnings, then allow specific lints that are too noisy
# for this codebase or are stylistic preferences.
pedantic = { level = "warn", priority = -1 }
must_use = { level = "warn", priority = -1 }

# Allow: these produce false positives or are too noisy for test-heavy code.
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
too_many_lines = "allow"
module_name_repetitions = "allow"
needless_pass_by_value = "allow"
cast_possible_truncation = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
must_use_unit = "allow"
return_self_not_must_use = "allow"
similar_names = "allow"
manual_let_else = "allow"
single_match_else = "allow"
unnested_or_patterns = "allow"
match_same_arms = "allow"
wildcard_enum_match_arm = "allow"
redundant_closure_for_method_calls = "allow"
unreadable_literal = "allow"
used_underscore_binding = "allow"
struct_excessive_bools = "allow"
unnecessary_wraps = "allow"
items_after_statements = "allow"
unused_self = "allow"
format_push_string = "allow"
wildcard_imports = "allow"
redundant_clone = "allow"
fn_to_numeric_cast = "allow"
assigning_clones = "allow"
ptr_arg = "allow"
float_cmp = "allow"
match_wildcard_for_single_variants = "allow"






