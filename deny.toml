[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]
ignore = [
    # GPUI / cosmic-text / usvg tree. No safe upgrade until Zed bumps these.
    { id = "RUSTSEC-2025-0052", reason = "async-std is a GPUI transitive; discontinued, not a known vuln" },
    { id = "RUSTSEC-2024-0384", reason = "instant is a GPUI transitive; unmaintained, not a known vuln" },
    { id = "RUSTSEC-2024-0436", reason = "paste is a GPUI transitive; unmaintained, not a known vuln" },
    { id = "RUSTSEC-2026-0173", reason = "proc-macro-error2 is a GPUI transitive; unmaintained, not a known vuln" },
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile is a GPUI transitive; unmaintained, not a known vuln" },
    { id = "RUSTSEC-2026-0206", reason = "rustybuzz is a GPUI/usvg transitive; unmaintained, not a known vuln" },
    { id = "RUSTSEC-2026-0192", reason = "ttf-parser is a GPUI/cosmic-text transitive; unmaintained, not a known vuln" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "0BSD",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
    "NCSA",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]

[sources]
allow-git = [
    "https://github.com/Smithay/wayland-rs.git",
]
