name: CLA

# CLA signs via fixed trusted action/API only; no checkout or execution of PR code.
# pull_request_target gives GITHUB_TOKEN write access on fork PRs so the bot
# can comment and record signatures. Never check out or run PR code here.
on:
  issue_comment: # zizmor: ignore[dangerous-triggers]
    types: [created]
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types: [opened, closed, synchronize]

permissions:
  actions: write # zizmor: ignore[excessive-permissions]
  contents: write # zizmor: ignore[excessive-permissions]
  pull-requests: write # zizmor: ignore[excessive-permissions]
  statuses: write # zizmor: ignore[excessive-permissions]

concurrency:
  group: cla-signatures
  cancel-in-progress: false

jobs:
  cla:
    if: >
      (github.event_name == 'issue_comment'
        && github.event.issue.pull_request
        && github.event.comment.user.type == 'User'
        && (github.event.comment.body == 'recheck'
          || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
      || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-license/cla-action@2e483ec09841118c52af4716e8875eb9832d1dd2 # v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # Signatures live on an unprotected branch because main requires status checks.
          branch: cla-signatures
          allowlist: thedavidweng,dependabot[bot]
