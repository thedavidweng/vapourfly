name: CLA

# pull_request_target gives GITHUB_TOKEN write access on fork PRs so the bot
# can comment and record signatures. Never check out or run PR code here.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: >
      (github.event.comment.body == 'recheck'
        || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA')
      || github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          # Signatures live on an unprotected branch because main requires status checks.
          branch: cla-signatures
          allowlist: thedavidweng,dependabot[bot],bot*
