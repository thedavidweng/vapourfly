name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep CI aligned with rust-toolchain.toml and regular local cargo commands.
  VAPOURFLY_CI_TOOLCHAIN: "1.99"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake clang g++ pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libasound2-dev \
            libssl-dev \
            libfontconfig1-dev \
            libudev-dev

      - name: Install Rust ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: cargo-deny

      # deny only reads the lockfile. fmt only reads sources. Clippy and
      # test stay in one script so test reuses target/. The workflow parser
      # here rejects a bare `wait` step, so the overlap is one parallel group.
      - parallel:
          - name: cargo deny check
            if: runner.os == 'Linux'
            run: cargo deny check

          - name: Format check
            run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} fmt --all -- --check

          - name: Clippy and test
            run: |
              cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} clippy --workspace --all-targets -- -D warnings
              cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} test --workspace
