name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep CI aligned with rust-toolchain.toml and regular local cargo commands.
  VAPOURFLY_CI_TOOLCHAIN: "1.96"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake clang g++ pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libasound2-dev \
            libssl-dev

      - name: Install Rust ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # master
        with:
          toolchain: ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} fmt --all -- --check

      - name: Clippy
        run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} test --workspace

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@f1dd293276342cf06b423f44b1c7c9312a2d2ecb # cargo-deny

      - name: cargo deny check
        if: runner.os == 'Linux'
        run: cargo deny check
