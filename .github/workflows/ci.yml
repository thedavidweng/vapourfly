name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep CI aligned with rust-toolchain.toml and regular local cargo commands.
  VAPOURFLY_CI_TOOLCHAIN: "1.96"

jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake clang g++ pkg-config \
            libxkbcommon-dev libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libasound2-dev \
            libssl-dev

      - name: Install Rust ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} fmt --all -- --check

      - name: Clippy
        run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} test --workspace

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@cargo-deny

      - name: cargo deny check
        if: runner.os == 'Linux'
        run: cargo deny check
