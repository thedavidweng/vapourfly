name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  # Keep CI aligned with rust-toolchain.toml and regular local cargo commands.
  VAPOURFLY_CI_TOOLCHAIN: "1.99.1"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Test release signing gate
        if: runner.os == 'macOS'
        run: python3 scripts/test-notarization.py

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake clang g++ pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libasound2-dev \
            libssl-dev \
            libfontconfig1-dev \
            libudev-dev

      - name: Install Rust ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
          components: rustfmt, clippy

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'

      - name: Test size inventory
        run: python3 scripts/test-size-report.py

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install cargo-deny
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny

      # deny only reads the lockfile. fmt only reads sources. Clippy and
      # test stay in one script so test reuses target/. The workflow parser
      # here rejects a bare `wait` step, so the overlap is one parallel group.
      - parallel:
          - name: cargo deny check
            if: runner.os == 'Linux'
            run: cargo deny check

          - name: Format check
            run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} fmt --all -- --check

          - name: Clippy and test
            run: |
              cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} clippy --workspace --all-targets -- -D warnings
              cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} test --workspace

  appimage:
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: '1.99.1'
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang g++ pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev libwayland-dev libx11-dev libxrandr-dev libxi-dev libxcursor-dev libxinerama-dev libgl1-mesa-dev libasound2-dev libssl-dev libfontconfig1-dev libudev-dev xvfb xdotool imagemagick squashfs-tools patchelf desktop-file-utils librsvg2-bin
      - run: cargo build --release -p vapourfly-gui
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15'
      - run: bash scripts/package-appimage.sh ci
      - run: xvfb-run -a bash scripts/smoke-appimage.sh dist/*.AppImage
      - name: Distribution size summary (non-gating)
        continue-on-error: true
        run: cat dist/size-appimage.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vapourfly-appimage
          path: |
            dist/*
            ${{ runner.temp }}/vapourfly-appimage.png
