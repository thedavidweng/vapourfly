name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VAPOURFLY_CI_TOOLCHAIN: "1.99"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: vapourfly-macos-aarch64
          - os: ubuntu-latest
            artifact: vapourfly-linux-x86_64
          - os: windows-latest
            artifact: vapourfly-windows-x86_64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake clang g++ pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libasound2-dev \
            libssl-dev \
            libfontconfig1-dev \
            libudev-dev

      - name: Install Rust ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: ${{ env.VAPOURFLY_CI_TOOLCHAIN }}

      - name: Cache cargo registry and target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-release-

      - name: Build release binaries
        run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} build --release -p vapourfly-cli -p vapourfly-gui

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          stage="${{ matrix.artifact }}"
          mkdir -p "$stage"
          cp target/release/vapourfly "$stage/"
          cp README.md LICENSE "$stage/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            version="${GITHUB_REF_NAME#v}"
            app="$stage/Vapourfly.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp target/release/vapourfly-gui "$app/Contents/MacOS/vapourfly-gui"
            chmod +x "$app/Contents/MacOS/vapourfly-gui"
            sed "s/@VERSION@/${version}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
            cp packaging/macos/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
            codesign --force --deep --sign - "$app"
          else
            cp target/release/vapourfly-gui "$stage/"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/linux/vapourfly.desktop scripts/install-steamos.sh "$stage/"
          fi
          COPYFILE_DISABLE=1 tar -czf "${stage}.tar.gz" "$stage"

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/vapourfly.exe $stage/
          Copy-Item target/release/vapourfly-gui.exe $stage/
          Copy-Item README.md,LICENSE $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip

  publish:
    permissions:
      contents: write
    timeout-minutes: 60
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip)
          notes=$(awk '
            /^## \[0\./ { if (found) exit; found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          install=$(printf '%s\n' \
            '' \
            '### Installation' \
            '' \
            '```bash' \
            '# Homebrew (macOS)' \
            'brew install --cask thedavidweng/tap/vapourfly' \
            '```')
          full_notes=$(printf '%s\n%s' "${notes:-Release ${GITHUB_REF_NAME}}" "$install")
          if gh release view "${GITHUB_REF_NAME}" &>/dev/null; then
            gh release edit "${GITHUB_REF_NAME}" --notes "$full_notes"
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "$full_notes" \
              "${files[@]}"
          fi
