name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  VAPOURFLY_CI_TOOLCHAIN: "1.99"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  build:
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: vapourfly-macos-aarch64
          - os: ubuntu-22.04
            artifact: vapourfly-linux-x86_64
          - os: windows-latest
            artifact: vapourfly-windows-x86_64

    runs-on: ${{ matrix.os }}

    env:
      APPLE_SIGNING_IDENTITY: "Developer ID Application: MOE AI LLC (NCFNX3LJ83)"
      APPLE_TEAM_ID: NCFNX3LJ83
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Import Developer ID signing identity
        if: runner.os == 'macOS'
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE_BASE64:?}" "${CERTIFICATE_PASSWORD:?}" "${API_KEY_BASE64:?}"
          umask 077
          keychain="$RUNNER_TEMP/release-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$keychain_password" "$keychain" > /dev/null
          security find-identity -v -p codesigning "$keychain" | grep -F "$APPLE_SIGNING_IDENTITY"
          echo "APPLE_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-key.p8" >> "$GITHUB_ENV"

      - name: Test release signing gate
        if: runner.os == 'macOS'
        run: python3 scripts/test-notarization.py

      - name: Install Linux GUI build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            cmake clang g++ pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev \
            libwayland-dev \
            libx11-dev libxrandr-dev libxi-dev \
            libxcursor-dev libxinerama-dev \
            libgl1-mesa-dev libasound2-dev \
            libssl-dev \
            libfontconfig1-dev \
            libudev-dev xvfb xdotool imagemagick squashfs-tools patchelf desktop-file-utils librsvg2-bin

      - name: Install Rust ${{ env.VAPOURFLY_CI_TOOLCHAIN }}
        uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master
        with:
          toolchain: ${{ env.VAPOURFLY_CI_TOOLCHAIN }}

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        continue-on-error: true
        with:
          python-version: '3.12'

      - name: Build release binaries
        run: cargo +${{ env.VAPOURFLY_CI_TOOLCHAIN }} build --release -p vapourfly-cli -p vapourfly-gui

      - name: Package and verify updateable AppImage
        if: runner.os == 'Linux'
        run: |
          bash scripts/package-appimage.sh "${GITHUB_REF_NAME#v}"
          xvfb-run -a bash scripts/smoke-appimage.sh dist/*.AppImage

      - name: Package Unix archive
        if: runner.os != 'Windows'
        run: |
          stage="${{ matrix.artifact }}"
          mkdir -p "$stage"
          cp target/release/vapourfly "$stage/"
          cp README.md LICENSE "$stage/"
          if [ "${{ runner.os }}" = "macOS" ]; then
            version="${GITHUB_REF_NAME#v}"
            app="$stage/Vapourfly.app"
            mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
            cp target/release/vapourfly-gui "$app/Contents/MacOS/vapourfly-gui"
            chmod +x "$app/Contents/MacOS/vapourfly-gui"
            sed "s/@VERSION@/${version}/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
            cp packaging/macos/AppIcon.icns "$app/Contents/Resources/AppIcon.icns"
            bash scripts/sign-and-notarize.sh "$stage"
          else
            cp target/release/vapourfly-gui "$stage/"
          fi
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp packaging/linux/vapourfly.desktop scripts/install-steamos.sh "$stage/"
          fi
          COPYFILE_DISABLE=1 tar -czf "${stage}.tar.gz" "$stage"

      - name: Package Windows zip
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $stage = "${{ matrix.artifact }}"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item target/release/vapourfly.exe $stage/
          Copy-Item target/release/vapourfly-gui.exe $stage/
          Copy-Item README.md,LICENSE $stage/
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"

      - name: Report actual distribution size (non-gating)
        continue-on-error: true
        shell: bash
        run: |
          stage="${{ matrix.artifact }}"
          if [ "$RUNNER_OS" = "Windows" ]; then
            archive="${stage}.zip"
          else
            archive="${stage}.tar.gz"
          fi
          python3 scripts/size-report.py --stage "$stage" --asset "$archive" \
            --target "${{ matrix.artifact }}" --revision "$GITHUB_SHA" \
            --toolchain "$VAPOURFLY_CI_TOOLCHAIN" --out "size-reports/${stage}" \
            >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distribution size report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: size-${{ matrix.artifact }}
          path: |
            size-reports/*
            dist/size-appimage.*

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.tar.gz
            ${{ matrix.artifact }}.zip
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.AppImage.sha256

      - name: Remove signing material
        if: always() && runner.os == 'macOS'
        run: |
          if [[ -f "$RUNNER_TEMP/release-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/release-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/developer-id.p12" "$RUNNER_TEMP/notary-key.p8"

  publish:
    permissions:
      contents: write
    timeout-minutes: 60
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(dist/*.tar.gz dist/*.zip dist/*.AppImage dist/*.AppImage.zsync dist/*.AppImage.sha256)
          notes=$(awk '
            /^## \[0\./ { if (found) exit; found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md)
          install=$(printf '%s\n' \
            '' \
            '### Installation' \
            '' \
            '```bash' \
            '# Homebrew (macOS)' \
            'brew install --cask thedavidweng/tap/vapourfly' \
            '```')
          full_notes=$(printf '%s\n%s' "${notes:-Release ${GITHUB_REF_NAME}}" "$install")
          if gh release view "${GITHUB_REF_NAME}" &>/dev/null; then
            gh release edit "${GITHUB_REF_NAME}" --notes "$full_notes"
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" \
              --notes "$full_notes" \
              "${files[@]}"
          fi
